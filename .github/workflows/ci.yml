name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check vendor sha256
        run: python3 tools/check_vendor_sha256.py

      - name: Run tests
        run: node --test

      - name: Install vault dependencies
        run: python3 -m pip install -r tools/requirements-vault.txt

      - name: Run vault encrypt tests
        run: python3 -m unittest tests/test_encrypt_vault.py
