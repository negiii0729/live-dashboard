<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live 观演记录</title>
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1117;
      --card: #181b24;
      --line: #272b38;
      --txt: #e7e9ee;
      --mut: #8b91a3;
      --a: #ff6b8b;
      --b: #5cc8ff;
      --c: #ffc857;
      --d: #7be0a6;
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--txt);
      font-family: "Noto Sans CJK SC", "Noto Sans CJK JP", "PingFang SC", "Hiragino Sans", "Microsoft YaHei", system-ui, sans-serif;
    }

    .boot {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 24px;
      color: var(--mut);
    }

    .wrap { max-width: 1280px; margin: 0 auto; padding: 28px 24px 48px; }

    h1 { font-size: 26px; margin: 0 0 4px; }

    .sub { color: var(--mut); font-size: 13px; margin-bottom: 22px; }

    .sample { color: var(--mut); font-size: 12px; margin: -14px 0 22px; }

    .grid { display: grid; gap: 16px; }

    .k { grid-template-columns: repeat(var(--kpi-cols, 6), minmax(0, 1fr)); }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      min-width: 0;
    }

    .kpi .l { color: var(--mut); font-size: 12px; }

    .kpi .v { font-size: 30px; font-weight: 700; margin-top: 6px; }

    .kpi .v.price { font-size: 24px; }

    .kpi .h { color: var(--mut); font-size: 12px; margin-top: 4px; line-height: 1.5; }

    .g2 { grid-template-columns: 1fr 1.6fr; margin-top: 16px; }

    .g3 { grid-template-columns: 1fr 1fr 1fr; margin-top: 16px; }

    h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }

    h2 small { color: var(--mut); font-weight: 400; font-size: 12px; margin-left: 6px; }

    .ch { height: 340px; width: 100%; }

    .ch.tall { height: 560px; }

    ul.list { list-style: none; margin: 0; padding: 0; font-size: 13px; }

    ul.list li {
      padding: 8px 0;
      border-bottom: 1px dashed var(--line);
      display: flex;
      gap: 10px;
    }

    ul.list .d { color: var(--c); min-width: 84px; font-variant-numeric: tabular-nums; }

    ul.list .m { color: var(--mut); }

    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--mut);
      white-space: nowrap;
    }

    .t-ワンマン { color: var(--a); border-color: #ff6b8b55; }

    .t-対バン { color: var(--b); border-color: #5cc8ff55; }

    .t-フェス { color: var(--c); border-color: #ffc85755; }

    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }

    input, select {
      background: #10131b;
      color: var(--txt);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      font: inherit;
      font-size: 13px;
    }

    input { flex: 1; min-width: 220px; }

    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }

    th, td {
      text-align: left;
      padding: 7px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    th {
      color: var(--mut);
      font-weight: 500;
      position: sticky;
      top: 0;
      background: var(--card);
      cursor: pointer;
    }

    td.art { max-width: 300px; }

    td:nth-child(2) { white-space: nowrap; }

    td.num { text-align: right; font-variant-numeric: tabular-nums; }

    tr.s-upcoming td { color: #ffd98a; }

    tr.s-undated td, tr.s-unmarked td { color: var(--mut); }

    .tbl { max-height: 640px; overflow: auto; }

    .cnt { color: var(--mut); font-size: 12px; margin-left: auto; align-self: center; }

    .table-card { margin-top: 16px; }

    .note { color: var(--mut); font-size: 12px; margin-top: 10px; line-height: 1.6; }

    .tools { padding-bottom: 0; }

    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

    button {
      background: #10131b;
      color: var(--txt);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.45; cursor: default; }

    .hint { color: var(--mut); font-size: 12px; margin: 0; flex: 1; min-width: 180px; }

    .guide {
      margin-top: 14px;
      color: var(--mut);
      font-size: 13px;
      line-height: 1.7;
    }

    .guide p { margin: 0 0 6px; }

    .boot.error { color: #ffd2dc; white-space: pre-wrap; }

    .ch.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mut);
      font-size: 14px;
    }

    body.is-drag .tools {
      outline: 1px dashed var(--b);
      border-radius: 12px;
    }

    .vault-card { max-width: 520px; }

    .vault-form {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }

    .vault-form label { color: var(--mut); font-size: 12px; }

    .vault-form input[type="password"] { flex: none; width: 100%; min-width: 0; }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--txt);
      font-size: 13px;
    }

    .remember input { flex: none; width: auto; min-width: 0; }

    .vault-form .note { margin: 0; }

    .vault-error { color: #ffd2dc; white-space: pre-wrap; font-size: 13px; margin: 0; }

    @media (max-width: 900px) {
      .k { grid-template-columns: repeat(2, 1fr); }
      .g2, .g3 { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .wrap { padding: 16px 10px 36px; }
      .card { padding: 12px 8px; }
      .ch { height: 460px; }
      .ch.tall { height: 520px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="wrap tools">
    <div class="bar" id="toolbar">
      <button type="button" id="pick-file">选择文件</button>
      <input id="file-input" type="file" accept=".csv,text/csv,.xlsx,.xls,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
      <button type="button" id="clear-data">清除数据</button>
      <p id="source-label" class="hint">也可以把 CSV 或 Excel 拖进页面。</p>
    </div>
    <div id="guide" class="guide" hidden>
      <p>当前没有载入你自己的表，下面是一份虚构示例。</p>
      <p>点「选择文件」，或把 CSV、Excel（.xlsx / .xls）拖进页面。表会留在这台浏览器里，刷新后还在。「清除数据」会删掉它，并回到这份示例。</p>
      <p>也可以在地址后加上 ?data= 公开 CSV 链接，用 ?config= 附上配置，用 ?today=YYYY-MM-DD 指定截止日期。加密数据用 ?vault= 指向 vault.json，在页面里输入密码。</p>
    </div>
  </div>
  <div id="dashboard"><p class="boot">正在载入。</p></div>
  <script src="./vendor/echarts-5.5.1.min.js"></script>
  <script src="./vendor/papaparse-5.7.0.min.js"></script>
  <script type="module">
    import { compute } from "./app/compute.js";
    import { describeLoadedSource, fetchVaultDocument, importFileNameOk, loadDashboard, loadQueryConfig, messageFor, readImportFile, searchAfterImport } from "./app/load.js";
    import { parseCsv } from "./app/parse.js";
    import { render } from "./app/render.js";
    import { createBrowserStorage, createMemoryStorage } from "./app/storage.js";
    import { decryptVault, unlockRememberedVault } from "./app/vault.js";

    const root = document.querySelector("#dashboard");
    const guide = document.querySelector("#guide");
    const sourceLabel = document.querySelector("#source-label");
    const clearButton = document.querySelector("#clear-data");
    const fileInput = document.querySelector("#file-input");
    const pickButton = document.querySelector("#pick-file");
    const storage = openStorage();
    let pageConfig = null;
    let vaultDoc = null;
    let vaultAttempt = 0;

    function openStorage() {
      try {
        return createBrowserStorage();
      } catch {
        return createMemoryStorage();
      }
    }

    function showError(text) {
      root.replaceChildren();
      const note = document.createElement("p");
      note.className = "boot error";
      note.setAttribute("role", "alert");
      note.textContent = text;
      root.append(note);
      guide.hidden = true;
    }

    function syncChrome(loaded, failed) {
      let saved = null;
      try {
        saved = storage.read();
      } catch {
        saved = null;
      }
      let remembered = null;
      try {
        remembered = storage.readVaultPassword();
      } catch {
        remembered = null;
      }
      const params = new URLSearchParams(location.search);
      const vaultMode = params.has("vault") && !params.has("data");
      clearButton.disabled = !saved && !remembered && loaded?.source !== "vault";
      if (vaultMode) {
        guide.hidden = true;
        if (loaded?.source === "vault" && !failed) {
          sourceLabel.textContent = "当前数据来自加密链接，已在这台浏览器里解开。";
        } else if (vaultDoc) {
          sourceLabel.textContent = "当前链接是加密数据。输入密码后在本地解开。";
        } else {
          sourceLabel.textContent = "加密数据没有载入。";
        }
        return;
      }
      if (failed || !loaded) {
        const notice = describeLoadedSource(null);
        sourceLabel.textContent = notice.label;
        guide.hidden = true;
        return;
      }
      const notice = describeLoadedSource(loaded);
      guide.hidden = !notice.showGuide;
      sourceLabel.textContent = notice.label;
    }

    function rememberImport(search) {
      const nextSearch = searchAfterImport(search);
      const url = new URL(location.href);
      history.replaceState(null, "", `${url.pathname}${nextSearch}${url.hash}`);
      return nextSearch;
    }

    function showPasswordForm(message, options = {}) {
      const remember = options.remember === true;
      const password = typeof options.password === "string" ? options.password : "";
      root.replaceChildren();
      document.title = "Live 观演记录";
      const wrap = document.createElement("div");
      wrap.className = "wrap";
      const form = document.createElement("form");
      form.className = "card vault-card vault-form";
      form.id = "vault-form";
      form.method = "post";
      form.action = "";
      const title = document.createElement("h2");
      title.textContent = "输入密码";
      const lead = document.createElement("p");
      lead.className = "note";
      lead.textContent = "这份观演数据已加密。密码只在这台浏览器里解开，不会随网络请求发送。";
      const label = document.createElement("label");
      label.htmlFor = "vault-password";
      label.textContent = "密码";
      const input = document.createElement("input");
      input.id = "vault-password";
      input.type = "password";
      input.autocomplete = "current-password";
      input.value = password;
      const rememberLabel = document.createElement("label");
      rememberLabel.className = "remember";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.id = "vault-remember";
      checkbox.checked = remember;
      rememberLabel.append(checkbox, document.createTextNode("记住密码"));
      const hint = document.createElement("p");
      hint.className = "note";
      hint.textContent = "勾选后，刷新不用再输。密码存在这台浏览器里，「清除数据」会一并删掉。";
      const alert = document.createElement("p");
      alert.className = "vault-error";
      alert.id = "vault-error";
      alert.setAttribute("role", "alert");
      if (message) alert.textContent = message;
      else alert.hidden = true;
      const button = document.createElement("button");
      button.type = "submit";
      button.id = "vault-open";
      button.textContent = "打开";
      form.append(title, lead, label, input, rememberLabel, hint, alert, button);
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!vaultDoc) return;
        button.disabled = true;
        input.disabled = true;
        checkbox.disabled = true;
        button.textContent = "正在解密…";
        void unlockVault(input.value, checkbox.checked);
      });
      wrap.append(form);
      root.append(wrap);
      syncChrome(null, true);
      input.focus();
      if (message) input.select();
    }

    function presentVault(opened) {
      const config = vaultDoc.hasQueryConfig ? vaultDoc.queryConfig : opened.config;
      pageConfig = config;
      const parsed = parseCsv(opened.csv, config);
      const stats = compute(parsed, vaultDoc.today);
      render(stats, parsed.rows, parsed.participants, root, {
        title: parsed.config.title,
        config: parsed.config,
        sample: false,
      });
      syncChrome({ source: "vault", sample: false, name: vaultDoc.url }, false);
    }

    async function unlockVault(password, remember) {
      const attempt = ++vaultAttempt;
      try {
        const opened = await decryptVault(vaultDoc.vault, password, globalThis.crypto);
        if (attempt !== vaultAttempt || !vaultDoc) return;
        presentVault(opened);
        if (attempt !== vaultAttempt) return;
        if (remember) storage.writeVaultPassword({ url: vaultDoc.url, password });
        else storage.clearVaultPassword();
      } catch (error) {
        if (attempt !== vaultAttempt) return;
        if (error?.name === "VaultError") {
          showPasswordForm(messageFor(error), { remember, password });
          return;
        }
        showError(messageFor(error));
        syncChrome(null, true);
      }
    }

    async function showVault(search) {
      const attempt = ++vaultAttempt;
      let doc;
      try {
        doc = await fetchVaultDocument({ search });
      } catch (error) {
        if (attempt !== vaultAttempt) return;
        vaultDoc = null;
        showError(messageFor(error));
        syncChrome(null, true);
        return;
      }
      if (attempt !== vaultAttempt) return;
      vaultDoc = doc;
      const saved = storage.readVaultPassword();
      if (saved && saved.url === vaultDoc.url) {
        const note = root.querySelector(".boot");
        if (note) note.textContent = "正在解密…";
        try {
          const remembered = await unlockRememberedVault(
            vaultDoc.vault,
            saved.password,
            storage,
            globalThis.crypto,
          );
          if (attempt !== vaultAttempt || !vaultDoc) return;
          if (!remembered.ok) {
            showPasswordForm(remembered.message, { remember: false, password: "" });
            return;
          }
          presentVault(remembered.opened);
        } catch (error) {
          if (attempt !== vaultAttempt) return;
          showError(messageFor(error));
          syncChrome(null, true);
        }
        return;
      }
      showPasswordForm(null, { remember: false, password: "" });
    }

    async function show(search) {
      const params = new URLSearchParams(String(search ?? "").replace(/^\?/, ""));
      if (params.has("vault") && !params.has("data")) {
        await showVault(search);
        return;
      }
      vaultDoc = null;
      try {
        const loaded = await loadDashboard({
          search,
          storage,
          sampleUrl: "examples/sample.csv",
        });
        pageConfig = loaded.config;
        const parsed = parseCsv(loaded.csv, loaded.config);
        const stats = compute(parsed, loaded.today);
        render(stats, parsed.rows, parsed.participants, root, {
          title: parsed.config.title,
          config: parsed.config,
          sample: loaded.source === "sample",
        });
        syncChrome(loaded, false);
      } catch (error) {
        showError(messageFor(error));
        syncChrome(null, true);
      }
    }

    async function importFile(file) {
      try {
        const params = new URLSearchParams(location.search);
        const config = params.has("config")
          ? await loadQueryConfig({ search: location.search })
          : pageConfig;
        const csv = await readImportFile(file, { config });
        parseCsv(csv, config);
        storage.write({ csv, name: file.name || "导入.csv" });
        pageConfig = config;
        const nextSearch = rememberImport(location.search);
        await show(nextSearch);
      } catch (error) {
        showError(messageFor(error));
        syncChrome(null, true);
      }
    }

    pickButton.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = "";
      if (file) void importFile(file);
    });
    clearButton.addEventListener("click", () => {
      vaultAttempt += 1;
      try {
        storage.clear();
      } catch (error) {
        showError(messageFor(error));
        return;
      }
      const params = new URLSearchParams(location.search);
      if (params.has("vault") && !params.has("data") && vaultDoc) {
        showPasswordForm(null, { remember: false, password: "" });
        return;
      }
      void show(location.search);
    });

    function hasFiles(event) {
      const types = event.dataTransfer ? event.dataTransfer.types : null;
      return types ? [...types].includes("Files") : false;
    }

    let dragDepth = 0;
    window.addEventListener("dragenter", (event) => {
      if (!hasFiles(event)) return;
      event.preventDefault();
      dragDepth += 1;
      document.body.classList.add("is-drag");
    });
    window.addEventListener("dragover", (event) => {
      if (!hasFiles(event)) return;
      event.preventDefault();
    });
    window.addEventListener("dragleave", () => {
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) document.body.classList.remove("is-drag");
    });
    window.addEventListener("drop", (event) => {
      if (!hasFiles(event)) return;
      event.preventDefault();
      dragDepth = 0;
      document.body.classList.remove("is-drag");
      const files = [...(event.dataTransfer?.files ?? [])];
      const file = files.find((item) => importFileNameOk(item.name));
      if (!file) {
        showError("请把 CSV 或 Excel 文件拖进页面。");
        syncChrome(null, true);
        return;
      }
      void importFile(file);
    });

    await show(location.search);
  </script>
</body>
</html>
