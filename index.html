<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live 观演记录</title>
  <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1c1f24;
      --muted: #5c6570;
      --line: #e3e6eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121417;
        --card: #1c2026;
        --text: #f2f4f7;
        --muted: #a7b0ba;
        --line: #2c333c;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    main {
      max-width: 40rem;
      margin: 4rem auto;
      padding: 2rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.75rem;
    }

    p { margin: 0.75rem 0; }

    #status { font-weight: 650; }

    .note { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Live 观演记录</h1>
    <p id="status">正在检查页面依赖。</p>
    <p class="note">这是通用观演记录页的骨架。仓库里没有观演数据，打开页面的人之后载入自己的表格。</p>
  </main>
  <script src="./vendor/echarts-5.5.1.min.js"></script>
  <script src="./vendor/papaparse-5.7.0.min.js"></script>
  <script type="module">
    const status = document.querySelector("#status");
    const chartReady = typeof globalThis.echarts?.init === "function";
    const parseReady = typeof globalThis.Papa?.parse === "function";
    if (!chartReady || !parseReady) {
      status.textContent = "页面依赖没有就绪。";
      throw new Error("vendor scripts did not attach");
    }
    status.textContent = "页面骨架已就绪。";
  </script>
</body>
</html>
